<!DOCTYPE html>
<html>
    <head>

    </head>
    <body>

    <div class="calc">

        <input type="text" class="display" readonly>

        <div class="buttons">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>/</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>*</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>

            <button>0</button>
            <button>.</button>
            <button class="equal">=</button>
            <button>+</button>
        </div>

    </div>

</body>
<Style>
    .display{
        width: 100%;
        height: 50px;
        margin-bottom: 15px;
        border-radius: 5px;
    }
    .buttons{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
    }
    button{
            height: 50px;
            font-size: 20px;
            border: none;
            border-radius: 5px;
            background-color: #444;
            color: white;
            
    }
    button:hover{
        background-color: #666;
    }
    .calc{
           width: 250px;
           background-color: #222;
           padding: 20px;
    }
    body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
    }
    .equal{
        background-color: rgb(230, 84, 26);
    }
</Style>
</html>
</html>
