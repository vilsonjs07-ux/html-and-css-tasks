<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing Page</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 60px;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  color:white;
  font-size:22px;
  font-weight:bold;
}

.menu{
  display:flex;
  list-style:none;
  gap:30px;
}

.menu a{
  color:white;
  text-decoration:none;
  font-size:14px;
  text-transform:uppercase;
  transition:0.3s;
}

.menu a:hover{
  color:#ffd700;
}

/* HERO SECTION */
.hero{
  height:100vh;
  background: linear-gradient(to right, #ff3c3c, #7b3fe4);
  color:white;
}

/* CENTER CONTENT */
.content{
  text-align:center;
  margin-top:120px;
  padding:0 20px;
}

.content h1{
  font-size:50px;
  margin-bottom:20px;
}

.content p{
  font-size:14px;
  max-width:600px;
  margin:auto;
  opacity:0.9;
}

/* PLAY BUTTON */
.play-btn{
  margin:40px auto;
  width:70px;
  height:70px;
  background:rgba(255,255,255,0.2);
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  transition:0.3s;
}

.play-btn:hover{
  background:rgba(255,255,255,0.4);
}

.play-btn::before{
  content:'▶';
  color:white;
  font-size:24px;
  margin-left:5px;
}

/* SECOND SECTION */
.section{
  background:#f5f5f5;
  padding:60px 20px;
  text-align:center;
}

.section h2{
  color:#e63946;
  letter-spacing:2px;
}

.section span{
  color:black;
  border-bottom:3px solid #e63946;
}
</style>

</head>
<body>

<!-- HERO -->
<div class="hero">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">INVOTION</div>
    <ul class="menu">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Portfolios</a></li>
      <li><a href="#">Service</a></li>
      <li><a href="#">Careers</a></li>
    </ul>
  </nav>

  <!-- CONTENT -->
  <div class="content">
    <h1>The best solutions ready</h1>
    <p>
      Pellentesque nec massa et turpis interdum sodales in eu augue.
      Nullam ipsum purus, porttitor molestie cursus sed, interdum eget magna.
    </p>

    <div class="play-btn"></div>
  </div>

</div>

<!-- NEXT SECTION -->
<div class="section">
  <h2>WE ARE <span>EXPERTS IN</span></h2>
</div>

</body>
</html>
