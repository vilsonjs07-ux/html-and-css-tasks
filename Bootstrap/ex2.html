<!DOCTYPE html>
<html >
<head>

    <title>Shoe Shop Cards</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .title{
            text-align: center;
            margin: 40px 0;
            font-weight: bold;
            color: #222;
        }

        .card{
            transition: 0.3s;
            border: none;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .card:hover{
            transform: translateY(-8px);
            box-shadow: 0 0 15px gray;
        }

        .card img{
            height: 220px;
            object-fit: cover;
        }

        .price{
            color: #e63946;
            font-size: 20px;
            font-weight: bold;
        }

        .btn-buy{
            background: black;
            color: white;
            border-radius: 30px;
            padding: 8px 20px;
        }

        .btn-buy:hover{
            background: #e63946;
            color: white;
        }
    </style>
</head>
<body>

<div class="container py-5">

    <h1 class="title">Shoe Shop</h1>

    <div class="row g-4">

        <!-- Card 1 -->
        <div class="col-md-4">
            <div class="card">
                <img src="shoe1.jpg" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Nike Air Max</h5>
                    <p class="price">₹4,999</p>
                    <button class="btn btn-buy">Buy Now</button>
                </div>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Adidas Runner</h5>
                    <p class="price">₹3,499</p>
                    <button class="btn btn-buy">Buy Now</button>
                </div>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1549298916-b41d501d3772" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Puma Sport</h5>
                    <p class="price">₹2,999</p>
                    <button class="btn btn-buy">Buy Now</button>
                </div>
            </div>
        </div>

        <!-- Card 4 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Reebok Classic</h5>
                    <p class="price">₹3,899</p>
                    <button class="btn btn-buy">Buy Now</button>
                </div>
            </div>
        </div>

        <!-- Card 5 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1460353581641-37baddab0fa2" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Campus Shoes</h5>
                    <p class="price">₹1,999</p>
                    <button class="btn btn-buy">Buy Now</button>
                </div>
            </div>
        </div>

        <!-- Card 6 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1511556532299-8f662fc26c06" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Woodland Boots</h5>
                    <p class="price">₹5,499</p>
                    <button class="btn btn-buy">Buy Now</button>
                </div>
            </div>
        </div>

        <!-- Card 7 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Skechers Go</h5>
                    <p class="price">₹4,299</p>
                    <button class="btn btn-buy">Buy Now</button>
                </div>
            </div>
        </div>

        <!-- Card 8 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1608231387042-66d1773070a5" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Fila Sneakers</h5>
                    <p class="price">₹3,299</p>
                    <button class="btn btn-buy">Buy Now</button>
                </div>
            </div>
        </div>

        <!-- Card 9 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1543508282-6319a3e2621f" class="card-img-top">
                <div class="card-body text-center">
                    <h5>Converse High</h5>
                    <p class="price">₹4,799</p>
                    <button class="btn btn-buy">Buy Now</button>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
