<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Navbar</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f2f2f2;
        }

        /* HERO SECTION */

        .hero{
            width:100%;
            height:100vh;
            background:
            linear-gradient(rgba(0,0,0,0.6),
            rgba(0,0,0,0.6)),
            url("background.jpg");

            background-size:cover;
            background-position:center;
        }

        /* NAVBAR */

        nav{
            width:100%;
            padding:20px 60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px solid rgba(255,255,255,0.2);
        }

        /* LOGO */

        .logo{
            color:white;
            font-size:30px;
            font-weight:bold;
        }

        .logo span{
            color:#ff5c7a;
        }

        /* MENU */

        .menu{
            display: flex;
            list-style:none;
            gap:35px;
        }

        .menu li a{
            text-decoration:none;
            color:white;
            font-size:14px;
            transition:0.3s;
        }

        .menu li a:hover{
            color:#ff5c7a;
        }

        /* RIGHT SIDE ICONS */

        .right-section{
            display:flex;
            align-items:center;
            gap:15px;
        }

        .icon{
            width:38px;
            height:38px;
            border-radius:50%;
            background:rgba(255,255,255,0.15);
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            cursor:pointer;
            transition:0.3s;
        }

        .icon:hover{
            background:#ff5c7a;
        }

        /* BUTTONS */

        .btn{
            padding:8px 18px;
            border:none;
            border-radius:5px;
            color:white;
            cursor:pointer;
            font-size:13px;
        }

        .signin{
            background:#00b894;
        }

        .signup{
            background:#3498db;
        }

        /* CENTER CONTENT */

        .content{
            background-image: url(img.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            opacity: 0.4;
            height:80vh;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            color:white;
            text-align:center;
        }

        .content i{
            font-size:40px;
            margin-bottom:20px;
        }

        .content h1{
            font-size:40px;
            margin-bottom:20px;
        }

        .content p{
            width:600px;
            line-height:28px;
            margin-bottom:30px;
            color:#ddd;
        }

        .shop-btn{
            padding:14px 30px;
            border:none;
            background:#ff5c7a;
            color:white;
            border-radius:5px;
            cursor:pointer;
            font-size:15px;
            transition:0.3s;
        }

        .shop-btn:hover{
            background:#ff2d55;
        }

    </style>
</head>
<body>

    <section class="hero">

        <!-- NAVBAR -->

        <nav>

            <div class="logo">
                <span>P</span>AKHI
            </div>

            <ul class="menu">
                <li><a href="#">HOME</a></li>
                <li><a href="#">DRESSES</a></li>
                <li><a href="#">BAGS</a></li>
                <li><a href="#">SHOES</a></li>
                <li><a href="#">CONTACT US</a></li>
            </ul>

            <div class="right-section">

                <div class="icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>

                <div class="icon">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>

                <button class="btn signin">Sign In</button>

                <button class="btn signup">Sign Up</button>

            </div>

        </nav>

        <!-- CONTENT -->

        <div class="content">

            <i class="fa-solid fa-cart-shopping"></i>

            <h1>Shopping Place For Girls</h1>

            <p>
                Lorem ipsum dolor sit amet consectetur adipisicing elit.
                Sed doloremque eveniet voluptatem quisquam.
            </p>

            <button class="shop-btn">
                ALL PRODUCTS
            </button>

        </div>

    </section>

</body>
</html>
