<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

/* PLAYER */

.player{
    width:400px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(20px);
    border-radius:30px;
    padding:25px;
    color:white;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
}

/* TOP */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.top i{
    font-size:22px;
    cursor:pointer;
}

/* IMAGE */

.image{
    width:250px;
    height:250px;
    margin:auto;
    border-radius:50%;
    overflow:hidden;
    border:8px solid rgba(255,255,255,0.1);
    animation:rotate 10s linear infinite;
}

.image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

@keyframes rotate{
    100%{
        transform:rotate(360deg);
    }
}

/* DETAILS */

.details{
    text-align:center;
    margin-top:25px;
}

.details h2{
    font-size:28px;
}

.details p{
    margin-top:8px;
    color:#cbd5e1;
}

/* AUDIO */

audio{
    width:100%;
    margin-top:25px;
    border-radius:20px;
}

/* CONTROLS */

.controls{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:25px;
}

.controls i{
    font-size:24px;
    transition:0.3s;
    cursor:pointer;
}

.controls i:hover{
    color:#00e5ff;
    transform:scale(1.2);
}

.play-btn{
    width:70px;
    height:70px;
    border-radius:50%;
    background:linear-gradient(to right,#00e5ff,#ff00f2);
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 0 20px rgba(255,255,255,0.3);
}

.play-btn i{
    font-size:30px;
}

/* PLAYLIST */

.playlist{
    margin-top:35px;
}

.playlist h3{
    margin-bottom:20px;
}

.song{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,0.05);
    padding:12px;
    border-radius:15px;
    margin-bottom:15px;
    transition:0.3s;
}

.song:hover{
    background:rgba(255,255,255,0.12);
    transform:translateX(5px);
}

.left{
    display:flex;
    align-items:center;
    gap:15px;
}

.left img{
    width:60px;
    height:60px;
    border-radius:10px;
    object-fit:cover;
}

.artist{
    color:#cbd5e1;
    font-size:13px;
}

.duration{
    color:#cbd5e1;
}

/* MOBILE */

@media(max-width:500px){

    .player{
        width:100%;
    }

    .image{
        width:220px;
        height:220px;
    }

}

</style>
</head>

<body>

<div class="player">

    <!-- TOP -->

    <div class="top">
        <i class="fa-solid fa-angle-left"></i>
        <h3>Now Playing</h3>
        <i class="fa-solid fa-bars"></i>
    </div>

    <!-- IMAGE -->

    <div class="image">
        <img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1000">
    </div>

    <!-- DETAILS -->

    <div class="details">
        <h2>Midnight Waves</h2>
        <p>Alan Walker</p>
    </div>

    <!-- REAL PLAYABLE AUDIO -->

    <audio controls>
        <source src="song.mp3" type="audio/mp3">
    </audio>

    <!-- CONTROLS -->

    <div class="controls">

        <i class="fa-solid fa-backward-step"></i>

        <div class="play-btn">
            <i class="fa-solid fa-play"></i>
        </div>

        <i class="fa-solid fa-forward-step"></i>

    </div>

    <!-- PLAYLIST -->

    <div class="playlist">

        <h3>Playlist</h3>

        <div class="song">

            <div class="left">

                <img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1000">

                <div>
                    <div>Midnight Waves</div>
                    <div class="artist">Alan Walker</div>
                </div>

            </div>

            <div class="duration">4:32</div>

        </div>

        <div class="song">

            <div class="left">

                <img src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?q=80&w=1000">

                <div>
                    <div>Electric Dreams</div>
                    <div class="artist">DJ Nova</div>
                </div>

            </div>

            <div class="duration">3:55</div>

        </div>

    </div>

</div>

</body>
</html>
