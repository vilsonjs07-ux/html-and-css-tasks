<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Player</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#1e1e2f,#3b1f5c,#0f3460);
    }

    .player{
      width:350px;
      background:rgba(255,255,255,0.1);
      backdrop-filter:blur(12px);
      border-radius:25px;
      padding:25px;
      text-align:center;
      color:white;
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }

    .album img{
      width:220px;
      height:220px;
      border-radius:20px;
      object-fit:cover;
      box-shadow:0 8px 20px rgba(0,0,0,0.5);
    }

    h2{
      margin-top:20px;
      font-size:28px;
    }

    p{
      margin-top:8px;
      color:#dcdcdc;
      font-size:15px;
    }

    .progress{
      width:100%;
      height:6px;
      background:#555;
      border-radius:10px;
      margin:25px 0;
      overflow:hidden;
    }

    .progress-bar{
      width:65%;
      height:100%;
      background:linear-gradient(to right,#ff4e50,#f9d423);
      border-radius:10px;
    }

    .time{
      display:flex;
      justify-content:space-between;
      font-size:13px;
      margin-top:-15px;
      margin-bottom:20px;
      color:#ddd;
    }

    .controls{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:20px;
      margin-top:10px;
    }

    .btn{
      width:55px;
      height:55px;
      border-radius:50%;
      border:none;
      cursor:pointer;
      font-size:22px;
      background:white;
      color:#222;
      transition:0.3s;
    }

    .btn:hover{
      transform:scale(1.1);
      background:#ff4e50;
      color:white;
    }

    .play{
      width:70px;
      height:70px;
      font-size:28px;
      background:linear-gradient(135deg,#ff4e50,#f9d423);
      color:white;
    }

    .play:hover{
      background:white;
      color:#222;
    }

    .volume{
      margin-top:25px;
    }

    .volume input{
      width:100%;
      accent-color:#ff4e50;
    }
  </style>
</head>

<body>

  <div class="player">

    <div class="album">
      <img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=800" alt="album">
    </div>

    <h2>Dream Music</h2>
    <p>Unknown Artist</p>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>

    <div class="time">
      <span>2:10</span>
      <span>3:45</span>
    </div>

    <div class="controls">
      <button class="btn">⏮</button>
      <button class="btn play">▶</button>
      <button class="btn">⏭</button>
    </div>

    <div class="volume">
      <input type="range">
    </div>

  </div>

</body>
</html>
